<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden select-none">

    <!-- نافذة الإعدادات وأداة الرفع المدمجة -->
    <div id="settings-modal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-900 rounded-3xl w-full max-w-md p-6 shadow-2xl border border-slate-800 space-y-5 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                <h3 id="settings-title" class="text-lg font-bold flex items-center gap-2 text-indigo-400"><i class="fa-solid fa-sliders text-indigo-400"></i> إعدادات تبويب: الإضافات</h3>
                <button onclick="closeSettings()" class="text-slate-400 hover:text-white p-2 rounded-xl hover:bg-slate-800 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="space-y-4">
                <!-- تخصيص اسم التبويب -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">اسم التبويب الحالي:</label>
                    <div class="flex gap-2">
                        <input type="text" id="tab-custom-name" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                        <button onclick="saveTabName()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl text-sm font-medium transition">حفظ</button>
                    </div>
                </div>

                <!-- استيراد ملف HTML محلي -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">استيراد ملف HTML محلي:</label>
                    <input type="file" id="html-file-input" accept=".html,.htm" class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer bg-slate-800 rounded-xl border border-slate-700">
                </div>

                <!-- قسم الرفع المباشر إلى GitHub -->
                <div class="pt-4 border-t border-slate-800 space-y-3">
                    <h4 class="text-xs font-bold text-emerald-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-cloud-arrow-up"></i> رفع تطبيقك إلى GitHub مباشرة
                    </h4>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">GitHub Personal Access Token:</label>
                        <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <button onclick="uploadAppToGitHub()" id="deploy-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20" disabled="">
                        <i class="fa-solid fa-paper-plane"></i> رفع النسخة الحالية إلى المستودع
                    </button>
                    <div id="deploy-status" class="text-[11px] text-slate-400 p-2.5 bg-slate-950 rounded-xl border border-slate-800"><i class="fa-solid fa-spinner fa-spin"></i> جاري رفع التطبيق إلى المستودع...</div>
                </div>
            </div>

            <div class="pt-2 border-t border-slate-800 flex justify-between items-center">
                <button onclick="clearCurrentTab()" class="text-red-400 hover:text-red-300 text-xs flex items-center gap-1.5 py-2">
                    <i class="fa-solid fa-trash-can"></i> تفريغ التبويب
                </button>
                <button onclick="closeSettings()" class="bg-slate-800 hover:bg-slate-700 text-white px-5 py-2 rounded-xl text-xs font-medium transition">
                    إغلاق
                </button>
            </div>
        </div>
    </div>

    <!-- الشريط العلوي للتطبيق -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex justify-between items-center z-30">
        <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse"></span>
            <span id="active-tab-title" class="font-bold text-sm text-white">الإضافات</span>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="openSettings()" class="bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-400 px-3 py-1.5 rounded-xl text-xs font-medium transition border border-indigo-500/30 flex items-center gap-1.5">
                <i class="fa-solid fa-gear"></i> الإعدادات والرفع
            </button>
        </div>
    </header>

    <!-- منطقة عرض الـ HTML بملء الشاشة -->
    <main class="flex-1 relative bg-black overflow-hidden flex flex-col">
        <div id="default-view" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center z-10 bg-slate-950 hidden">
            <div class="w-20 h-20 bg-indigo-600/10 text-indigo-400 rounded-3xl mb-4 flex items-center justify-center text-3xl border border-indigo-500/20 shadow-inner">
                <i class="fa-solid fa-file-arrow-up"></i>
            </div>
            <h2 class="text-base font-bold text-white mb-2">لا يوجد ملف HTML مستورد لهذا التبويب</h2>
            <p class="text-xs text-slate-400 max-w-xs mb-6 leading-relaxed">استورد ملف HTML من جهازك ليتم عرضه بملء الشاشة وحفظه تلقائياً.</p>
            <button onclick="openSettings()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-3 rounded-2xl shadow-lg shadow-indigo-600/30 text-xs transition">
                استيراد ملف HTML الآن
            </button>
        </div>
        <iframe id="html-viewer" class="absolute inset-0 w-full h-full border-0 bg-white" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;ar&quot; dir=&quot;rtl&quot;&gt;
&lt;head&gt;
    &lt;meta charset=&quot;UTF-8&quot;&gt;

&lt;body&gt;

    &lt;!-- Loading --&gt;
    &lt;div class=&quot;loading-overlay&quot; id=&quot;loadingOverlay&quot;&gt;
        &lt;div class=&quot;spinner&quot;&gt;&lt;/div&gt;

            &lt;thead&gt;
                &lt;tr&gt;
                    &lt;th&gt;عليه&lt;/th&gt;
                    &lt;th&gt;التفاصيل&lt;/th&gt;

                &lt;/tr&gt;

            &lt;input type=&quot;number&quot; id=&quot;received-amount&quot; placeholder=&quot;أدخل المبلغ&quot; oninput=&quot;updateAllBalances()&quot; step=&quot;any&quot;&gt;

    &lt;!-- أزرار التحكم --&gt;
    &lt;div class=&quot;actions-bottom&quot;&gt;
        &lt;button class=&quot;action-btn btn-print&quot; onclick=&quot;printAndSave()&quot;&gt;🖨️ طباعة&lt;/button&gt;
        &lt;button class=&quot;action-btn btn-save&quot; onclick=&quot;saveOnly()&quot;&gt;💾 حفظ&lt;/button&gt;

    &lt;datalist id=&quot;noteSuggestions&quot;&gt;&lt;/datalist&gt;

    &lt;script&gt;
        // ============================================================
        // 1. إدارة الاقتراحات
        // ============================================================
        const SUGGESTIONS_KEY = 'account_suggestions';
        let suggestionsSet = new Set();

        function loadSuggestions() {
            try {
                const saved = localStorage.getItem(SUGGESTIONS_KEY);
                if (saved) JSON.parse(saved).forEach(s =&gt; suggestionsSet.add(s));
            } catch (e) {}
            updateDatalist();
        }

        function saveSuggestions() {
            try { localStorage.setItem(SUGGESTIONS_KEY, JSON.stringify(Array.from(suggestionsSet))); } catch (e) {}
        }

        function addSuggestion(text) {
            if (!text || !text.trim()) return;
            const t = text.trim();
            if (!suggestionsSet.has(t)) { suggestionsSet.add(t);
                saveSuggestions();
                updateDatalist(); }
        }

        function updateDatalist() {
            const dl = document.getElementById('noteSuggestions');
            dl.innerHTML = '';
            Array.from(suggestionsSet).sort((a, b) =&gt; a.localeCompare(b, 'ar')).forEach(s =&gt; {
                const o = document.createElement('option');
                o.value = s;
                dl.appendChild(o);
            });
        }

        function collectSuggestions() {
            document.querySelectorAll('.note-input').forEach(inp =&gt; {
                const v = inp.value.trim();
                if (v) addSuggestion(v);
            });
        }

        // ============================================================
        // 2. إدارة البيانات
        // ============================================================
        const DATA_KEY = 'account_data';
        const RECORD_KEY = 'account_records';

        function saveData() {
            const client = document.getElementById('client-name').value;
            const received = document.getElementById('received-amount').value;
            const rows = [];
            document.querySelectorAll('#table-body tr').forEach(tr =&gt; {
                rows.push({
                    debit: tr.querySelector('.debit')?.value || '',
                    note: tr.querySelector('.note-input')?.value || ''
                });
            });
            try { localStorage.setItem(DATA_KEY, JSON.stringify({ client, received, rows })); } catch (e) {}
        }

        function loadData() {
            try {
                const raw = localStorage.getItem(DATA_KEY);
                if (!raw) return false;
                const data = JSON.parse(raw);
                document.getElementById('client-name').value = data.client || '';
                document.getElementById('received-amount').value = data.received || '';
                const tbody = document.getElementById('table-body');
                tbody.innerHTML = '';
                if (data.rows &amp;&amp; data.rows.length) {
                    data.rows.forEach(r =&gt; {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            &lt;td&gt;&lt;input type=&quot;number&quot; class=&quot;cell-input debit&quot; oninput=&quot;onInputChange()&quot; step=&quot;any&quot; placeholder=&quot;0&quot; value=&quot;${r.debit}&quot;&gt;&lt;/td&gt;
                            &lt;td&gt;&lt;input type=&quot;text&quot; class=&quot;note-input&quot; list=&quot;noteSuggestions&quot; placeholder=&quot;ملاحظة&quot; 
                                   oninput=&quot;handleNoteInput(this)&quot; onchange=&quot;handleNoteChange(this)&quot; value=&quot;${r.note}&quot;&gt;&lt;/td&gt;
                            &lt;td&gt;&lt;input type=&quot;text&quot; class=&quot;cell-input balance&quot; readonly value=&quot;0.00&quot;&gt;&lt;/td&gt;
                            &lt;td class=&quot;no-print&quot;&gt;&lt;button class=&quot;btn-delete&quot; onclick=&quot;deleteRow(this)&quot;&gt;✕&lt;/button&gt;&lt;/td&gt;
                        `;
                        tbody.appendChild(tr);
                    });
                    updateAllBalances();
                    return true;
                }
            } catch (e) {}
            return false;
        }

        // ============================================================
        // 3. دوال الجدول
        // ============================================================
        let updateTimer = null;

        function onInputChange() {
            if (updateTimer) cancelAnimationFrame(updateTimer);
            updateTimer = requestAnimationFrame(() =&gt; {
                updateAllBalances();
                saveData();
            });
        }

        function initializeTable() {
            const loaded = loadData();
            if (!loaded) { addEmptyRow();
                addEmptyRow(); }
            collectSuggestions();
            document.getElementById('client-name').addEventListener('input', saveData);
            document.getElementById('received-amount').addEventListener('input', saveData);
            document.getElementById('currentDate').textContent = '📅 ' + new Date().toLocaleDateString('ar-EG');
        }

        function addEmptyRow() {
            const tbody = document.getElementById('table-body');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                &lt;td&gt;&lt;input type=&quot;number&quot; class=&quot;cell-input debit&quot; oninput=&quot;onInputChange()&quot; step=&quot;any&quot; placeholder=&quot;0&quot;&gt;&lt;/td&gt;
                &lt;td&gt;&lt;input type=&quot;text&quot; class=&quot;note-input&quot; list=&quot;noteSuggestions&quot; placeholder=&quot;ملاحظة&quot; 
                       oninput=&quot;handleNoteInput(this)&quot; onchange=&quot;handleNoteChange(this)&quot;&gt;&lt;/td&gt;
                &lt;td&gt;&lt;input type=&quot;text&quot; class=&quot;cell-input balance&quot; readonly value=&quot;0.00&quot;&gt;&lt;/td&gt;
                &lt;td class=&quot;no-print&quot;&gt;&lt;button class=&quot;btn-delete&quot; onclick=&quot;deleteRow(this)&quot;&gt;✕&lt;/button&gt;&lt;/td&gt;
            `;
            tbody.appendChild(tr);
            updateAllBalances();
            saveData();
        }

        function addRow() {
            addEmptyRow();
            setTimeout(collectSuggestions, 50);
            showToast('✅ تم إضافة سطر جديد', 'success');
        }

        function deleteRow(btn) {
            const row = btn.closest('tr');
            const tbody = document.getElementById('table-body');
            if (tbody.children.length &lt;= 1) {
                showToast('⚠️ لا يمكن حذف الصف الأخير', 'error');
                return;
            }
            row.remove();
            collectSuggestions();
            updateAllBalances();
            saveData();
            showToast('🗑️ تم حذف السطر', 'success');
        }

        function resetTable() {
            if (!confirm('⚠️ هل أنت متأكد من تصفير الجدول؟ سيتم حذف كل البيانات.')) return;
            document.getElementById('table-body').innerHTML = '';
            document.getElementById('received-amount').value = '';
            addEmptyRow();
            addEmptyRow();
            document.getElementById('client-name').value = '';
            updateAllBalances();
            saveData();
            showToast('🗑️ تم تصفير الجدول', 'success');
        }

        // ============================================================
        // 4. تحديث الأرصدة والإجماليات
        // ============================================================
        function updateAllBalances() {
            const rows = document.querySelectorAll('#table-body tr');
            let running = 0;

            rows.forEach(row =&gt; {
                const debit = parseFloat(row.querySelector('.debit')?.value) || 0;
                const balanceInput = row.querySelector('.balance');

                running = running + debit;

                if (running &gt; 0) {
                    balanceInput.value = '🔴 ' + running.toFixed(2) + ' (عليه)';
                    balanceInput.style.color = '#e53e3e';
                    balanceInput.style.fontWeight = '700';
                } else if (running &lt; 0) {
                    balanceInput.value = '🟢 ' + Math.abs(running).toFixed(2) + ' (له)';
                    balanceInput.style.color = '#10b981';
                    balanceInput.style.fontWeight = '700';
                } else {
                    balanceInput.value = '⚪ 0.00';
                    balanceInput.style.color = '#2d3748';
                    balanceInput.style.fontWeight = '400';
                }
            });

            calculateTotals();
        }

        function calculateTotals() {
            let totalDebit = 0;
            document.querySelectorAll('.debit').forEach(inp =&gt; totalDebit += parseFloat(inp.value) || 0);

            const received = parseFloat(document.getElementById('received-amount').value) || 0;

            document.getElementById('total-debit').textContent = totalDebit.toFixed(2);

            const net = totalDebit - received;
            const netEl = document.getElementById('net-balance');
            if (net &gt; 0) {
                netEl.textContent = '🔴 ' + net.toFixed(2) + ' (عليه)';
                netEl.style.color = '#e53e3e';
            } else if (net &lt; 0) {
                netEl.textContent = '🟢 ' + Math.abs(net).toFixed(2) + ' (له)';
                netEl.style.color = '#10b981';
            } else {
                netEl.textContent = '⚪ 0.00';
                netEl.style.color = '#2d3748';
            }
        }

        // ============================================================
        // 5. معالجة الملاحظات
        // ============================================================
        function handleNoteInput(input) {
            const val = input.value.trim();
            if (val) addSuggestion(val);
            onInputChange();
        }

        function handleNoteChange(input) {
            const val = input.value.trim();
            if (val) addSuggestion(val);
            onInputChange();
        }

        // ============================================================
        // 6. حفظ وطباعة
        // ============================================================
        function saveInvoiceRecord() {
            const client = document.getElementById('client-name').value.trim() || 'بدون اسم';
            const date = new Date().toLocaleString('ar-EG');
            const received = parseFloat(document.getElementById('received-amount').value) || 0;
            const rows = [];
            let totalDebit = 0;

            document.querySelectorAll('#table-body tr').forEach(tr =&gt; {
                const debit = parseFloat(tr.querySelector('.debit')?.value) || 0;
                const note = tr.querySelector('.note-input')?.value || '';
                rows.push({ debit, note });
                totalDebit += debit;
            });

            const net = totalDebit - received;
            const record = {
                client,
                date,
                rows,
                totalDebit: totalDebit.toFixed(2),
                received: received.toFixed(2),
                net: net.toFixed(2)
            };

            let records = [];
            try {
                const saved = localStorage.getItem(RECORD_KEY);
                if (saved) records = JSON.parse(saved);
            } catch (e) {}
            records.unshift(record);
            try { localStorage.setItem(RECORD_KEY, JSON.stringify(records)); } catch (e) {}
        }

        function saveOnly() {
            saveInvoiceRecord();
            showToast('💾 تم حفظ الفاتورة في السجل', 'success');
        }

        function printAndSave() {
            saveInvoiceRecord();
            showToast('🖨️ تم حفظ الفاتورة وجاري الطباعة', 'success');
            setTimeout(() =&gt; window.print(), 300);
        }

        // ============================================================
        // 7. عرض السجل
        // ============================================================
        function toggleRecord() {
            const panel = document.getElementById('recordPanel');
            panel.classList.toggle('active');
            if (panel.classList.contains('active')) renderRecords();
        }

        function renderRecords() {
            const list = document.getElementById('recordList');
            list.innerHTML = '';
            let records = [];
            try {
                const saved = localStorage.getItem(RECORD_KEY);
                if (saved) records = JSON.parse(saved);
            } catch (e) {}

            if (!records.length) {
                list.innerHTML = '&lt;p style=&quot;text-align:center;color:#718096;&quot;&gt;📭 لا توجد فواتير محفوظة بعد.&lt;/p&gt;';
                return;
            }

            records.forEach((rec, index) =&gt; {
                const div = document.createElement('div');
                div.className = 'record-item';
                div.innerHTML = `
                    &lt;span class=&quot;client&quot;&gt;👤 ${rec.client}&lt;/span&gt;
                    &lt;span class=&quot;date&quot;&gt;📅 ${rec.date}&lt;/span&gt;
                    &lt;span class=&quot;amount&quot;&gt;💰 الصافي: ${rec.net}&lt;/span&gt;
                    &lt;span style=&quot;font-size:0.7rem;color:#718096;cursor:pointer;&quot; onclick=&quot;viewRecord(${index})&quot;&gt;👁️ عرض&lt;/span&gt;
                `;
                list.appendChild(div);
            });
        }

        function viewRecord(index) {
            let records = [];
            try {
                const saved = localStorage.getItem(RECORD_KEY);
                if (saved) records = JSON.parse(saved);
            } catch (e) {}
            if (!records[index]) return;

            const rec = records[index];
            alert(
                `📄 تفاصيل الفاتورة #${index+1}\n\n` +
                `العميل: ${rec.client}\n` +
                `التاريخ: ${rec.date}\n` +
                `إجمالي ما عليه: ${rec.totalDebit}\n` +
                `المبلغ الواصل: ${rec.received}\n` +
                `الصافي: ${rec.net}\n\n` +
                `التفاصيل:\n` +
                rec.rows.map((r, i) =&gt; `  ${i+1}. عليه: ${r.debit} | ملاحظة: ${r.note}`).join('\n')
            );
        }

        // ============================================================
        // 8. تصدير الصورة
        // ============================================================
        function showLoading() { document.getElementById('loadingOverlay').classList.add('active'); }

        function hideLoading() { document.getElementById('loadingOverlay').classList.remove('active'); }

        function downloadImage() {
            showLoading();
            const card = document.getElementById('invoice-card');
            const noPrint = document.querySelectorAll('.no-print');
            noPrint.forEach(el =&gt; el.style.display = 'none');

            html2canvas(card, { scale: 2.5, backgroundColor: '#ffffff', useCORS: true })
                .then(canvas =&gt; {
                    const link = document.createElement('a');
                    const name = document.getElementById('client-name').value.trim() || 'عميل';
                    link.download = `حساب_${name}.png`;
                    link.href = canvas.toDataURL('image/png');
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    hideLoading();
                    showToast('✅ تم تنزيل الصورة');
                    noPrint.forEach(el =&gt; el.style.display = '');
                })
                .catch(err =&gt; {
                    console.error(err);
                    hideLoading();
                    showToast('❌ خطأ في التنزيل', 'error');
                    noPrint.forEach(el =&gt; el.style.display = '');
                });
        }

        function copyImage() {
            showLoading();
            const card = document.getElementById('invoice-card');
            const noPrint = document.querySelectorAll('.no-print');
            noPrint.forEach(el =&gt; el.style.display = 'none');

            html2canvas(card, { scale: 2.5, backgroundColor: '#ffffff', useCORS: true })
                .then(canvas =&gt; {
                    canvas.toBlob(blob =&gt; {
                        if (navigator.clipboard &amp;&amp; window.ClipboardItem) {
                            const item = new ClipboardItem({ 'image/png': blob });
                            navigator.clipboard.write([item])
                                .then(() =&gt; {
                                    hideLoading();
                                    showToast('📋 تم نسخ الصورة');
                                    noPrint.forEach(el =&gt; el.style.display = '');
                                })
                                .catch(() =&gt; fallbackDownload(canvas, noPrint));
                        } else {
                            fallbackDownload(canvas, noPrint);
                        }
                    }, 'image/png');
                })
                .catch(err =&gt; {
                    console.error(err);
                    hideLoading();
                    showToast('❌ خطأ في النسخ', 'error');
                    noPrint.forEach(el =&gt; el.style.display = '');
                });
        }

        function fallbackDownload(canvas, noPrint) {
            const link = document.createElement('a');
            const name = document.getElementById('client-name').value.trim() || 'عميل';
            link.download = `حساب_${name}.png`;
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            hideLoading();
            showToast('✅ تم تنزيل الصورة (بديل)');
            if (noPrint) noPrint.forEach(el =&gt; el.style.display = '');
        }

        // ============================================================
        // 9. Toast
        // ============================================================
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast ' + type + ' show';
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(() =&gt; toast.classList.remove('show'), 2500);
        }

        // ============================================================
        // 10. التهيئة
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadSuggestions();
            initializeTable();

            document.addEventListener('input', function(e) {
                if (e.target.classList.contains('note-input')) {
                    const val = e.target.value.trim();
                    if (val) addSuggestion(val);
                }
            });
        });

        // تصدير الدوال
        window.addRow = addRow;
        window.deleteRow = deleteRow;
        window.resetTable = resetTable;
        window.updateAllBalances = updateAllBalances;
        window.downloadImage = downloadImage;
        window.copyImage = copyImage;
        window.handleNoteInput = handleNoteInput;
        window.handleNoteChange = handleNoteChange;
        window.onInputChange = onInputChange;
        window.printAndSave = printAndSave;
        window.saveOnly = saveOnly;
        window.toggleRecord = toggleRecord;
        window.viewRecord = viewRecord;
    &lt;/script&gt;

&lt;/body&gt;
&lt;/html&gt;"></iframe>
    </main>

    <!-- شريط التبويبات السفلي الـ 4 -->
    <nav class="bg-slate-900/95 backdrop-blur-md border-t border-slate-800 grid grid-cols-4 py-2 px-2 z-30">
        <button onclick="switchTab(0)" id="tab-btn-0" class="flex flex-col items-center justify-center py-1.5 rounded-2xl text-slate-400 hover:text-slate-200 transition">
            <i class="fa-solid fa-compass text-base mb-0.5"></i>
            <span id="tab-label-0" class="text-[10px] font-medium truncate w-full px-1 text-center">الرئيسية</span>
        </button>
        <button onclick="switchTab(1)" id="tab-btn-1" class="flex flex-col items-center justify-center py-1.5 rounded-2xl text-slate-400 hover:text-slate-200 transition">
            <i class="fa-solid fa-layer-group text-base mb-0.5"></i>
            <span id="tab-label-1" class="text-[10px] font-medium truncate w-full px-1 text-center">المفضلة</span>
        </button>
        <button onclick="switchTab(2)" id="tab-btn-2" class="flex flex-col items-center justify-center py-1.5 rounded-2xl text-slate-400 hover:text-slate-200 transition">
            <i class="fa-solid fa-bookmark text-base mb-0.5"></i>
            <span id="tab-label-2" class="text-[10px] font-medium truncate w-full px-1 text-center">الأدوات</span>
        </button>
        <button onclick="switchTab(3)" id="tab-btn-3" class="flex flex-col items-center justify-center py-1.5 rounded-2xl text-indigo-400 bg-indigo-600/10 transition font-bold">
            <i class="fa-solid fa-star text-base mb-0.5"></i>
            <span id="tab-label-3" class="text-[10px] font-medium truncate w-full px-1 text-center">الإضافات</span>
        </button>
    </nav>

    <script>
        const defaultNames = ["الرئيسية", "المفضلة", "الأدوات", "الإضافات"];
        let currentTab = 0;

        function getTabName(index) {
            return localStorage.getItem(`tab_name_${index}`) || defaultNames[index];
        }

        function switchTab(index) {
            currentTab = index;
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`tab-btn-${i}`);
                document.getElementById(`tab-label-${i}`).innerText = getTabName(i);
                if (i === index) {
                    btn.className = "flex flex-col items-center justify-center py-1.5 rounded-2xl text-indigo-400 bg-indigo-600/10 transition font-bold";
                } else {
                    btn.className = "flex flex-col items-center justify-center py-1.5 rounded-2xl text-slate-400 hover:text-slate-200 transition";
                }
            }
            document.getElementById('active-tab-title').innerText = getTabName(index);
            loadTabContent(index);
        }

        function loadTabContent(index) {
            const savedHtml = localStorage.getItem(`tab_html_${index}`);
            const defaultView = document.getElementById('default-view');
            const viewer = document.getElementById('html-viewer');

            if (savedHtml) {
                defaultView.classList.add('hidden');
                viewer.classList.remove('hidden');
                viewer.srcdoc = savedHtml;
            } else {
                defaultView.classList.remove('hidden');
                viewer.classList.add('hidden');
                viewer.srcdoc = '';
            }
        }

        function openSettings() {
            document.getElementById('tab-custom-name').value = getTabName(currentTab);
            document.getElementById('settings-title').innerHTML = `<i class="fa-solid fa-sliders text-indigo-400"></i> إعدادات تبويب: ${getTabName(currentTab)}`;
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function saveTabName() {
            const newName = document.getElementById('tab-custom-name').value.trim();
            if (newName) {
                localStorage.setItem(`tab_name_${currentTab}`, newName);
                document.getElementById(`tab-label-${currentTab}`).innerText = newName;
                document.getElementById('active-tab-title').innerText = newName;
                alert('تم تحديث اسم التبويب بنجاح!');
            }
        }

        function clearCurrentTab() {
            if (confirm('هل أنت متأكد من تفريغ هذا التبويب؟')) {
                localStorage.removeItem(`tab_html_${currentTab}`);
                loadTabContent(currentTab);
                closeSettings();
            }
        }

        document.getElementById('html-file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                localStorage.setItem(`tab_html_${currentTab}`, event.target.result);
                loadTabContent(currentTab);
                closeSettings();
                alert('تم استيراد وحفظ ملف HTML بنجاح!');
            };
            reader.readAsText(file);
        });

        // دالة الرفع المباشر إلى GitHub من داخل التطبيق
        async function uploadAppToGitHub() {
            const token = document.getElementById('gh-token').value.trim();
            const statusBox = document.getElementById('deploy-status');
            const deployBtn = document.getElementById('deploy-btn');
            
            const username = "salehalthbiany-crypto";
            const repo = "Hotpagesaleh";
            const path = "index.html";

            if (!token) {
                alert('الرجاء إدخال GitHub Personal Access Token!');
                return;
            }

            statusBox.classList.remove('hidden');
            statusBox.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري رفع التطبيق إلى المستودع...`;
            deployBtn.disabled = true;

            try {
                // جلب كود الصفحة الحالي بالكامل
                const fullHtmlContent = document.documentElement.outerHTML;
                const contentBase64 = btoa(unescape(encodeURIComponent(fullHtmlContent)));

                const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${path}`;
                
                // التحقق من SHA للملف القديم لضمان نجاح التحديث
                let sha = null;
                const getRes = await fetch(apiUrl, {
                    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                if (getRes.ok) {
                    const getData = await getRes.json();
                    sha = getData.sha;
                }

                const bodyData = {
                    message: "تحديث التطبيق الشامل عبر أداة الرفع المدمجة",
                    content: contentBase64,
                    branch: "main"
                };
                if (sha) bodyData.sha = sha;

                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify(bodyData)
                });

                if (putRes.ok) {
                    statusBox.innerHTML = `<span class="text-emerald-400 font-bold">✓ تم رفع وتحديث التطبيق في المستودع بنجاح!</span>`;
                } else {
                    const err = await putRes.json();
                    statusBox.innerHTML = `<span class="text-red-400">✗ فشل الرفع: ${err.message}</span>`;
                }
            } catch (e) {
                statusBox.innerHTML = `<span class="text-red-400">✗ حدث خطأ: ${e.message}</span>`;
            } finally {
                deployBtn.disabled = false;
            }
        }

        window.onload = function() {
            switchTab(0);
        };
    </script>
